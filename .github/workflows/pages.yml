name: Сайтты жариялау (GitHub Pages)

on:
  push:
    branches:
      - main
      - arena/79ee088b-i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Кодты жүктеу
        uses: actions/checkout@v4

      - name: Pages баптау
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Артефактіні дайындау
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Жариялау
        id: deployment
        uses: actions/deploy-pages@v4
